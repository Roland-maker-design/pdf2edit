name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 产品目标平台：exe 是 Windows 上打的，这一台是必须绿的
          - os: windows-latest
            python: "3.10"
          # 顺带验证 README 里"源码能在 Linux 上跑"这句话
          - os: ubuntu-latest
            python: "3.10"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖（Windows：含 PySide6，桌面窗口测试要用）
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 安装依赖（Linux：不装 PySide6，QObject 相关测试会自动跳过）
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 跑测试
        env:
          # Qt 测试不弹真窗口
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
