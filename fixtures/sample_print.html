<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>浏览器打印样本</title>
<style>
  body { font-family: "Microsoft YaHei", "SimSun", serif; margin: 40px; line-height: 1.7; }
  h1 { font-size: 24pt; }
  h2 { font-size: 16pt; margin-top: 1.2em; }
  table { border-collapse: collapse; margin: 1em 0; }
  td, th { border: 1px solid #444; padding: 4px 10px; }
</style>
</head>
<body>
  <h1>第一章 绪论</h1>
  <p>本节介绍研究背景与意义，用于验证标题层级识别是否可靠。这段文字故意写得长一些，
     好让浏览器在打印时把它折成两行，用来检查中文折行合并是否正确。</p>

  <h2>1.1 研究背景</h2>
  <p>国内外学者对该问题已有大量研究，主要集中在三个方面。</p>
  <ul>
    <li>第一，理论基础尚不完善。</li>
    <li>第二，实证数据相对匮乏。</li>
    <li>第三，方法体系有待统一。</li>
  </ul>

  <h2>1.2 主要数据</h2>
  <table>
    <tr><th>指标</th><th>2024</th><th>2025</th></tr>
    <tr><td>样本量</td><td>1200</td><td>1580</td></tr>
    <tr><td>准确率</td><td>91.2%</td><td>93.7%</td></tr>
  </table>
  <p>Last paragraph in English to verify spacing is preserved.</p>
</body>
</html>
